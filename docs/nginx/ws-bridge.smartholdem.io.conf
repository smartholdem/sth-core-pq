# nginx: TLS-терминация WebSocket-моста sth-core (SHIP-44) — wss://ws.smartholdem.io
#
#   wss://ws.smartholdem.io/ws/events[/<EndpointId>]  → 127.0.0.1:4005  push-события кошелька (sth/events/1)
#   wss://ws.smartholdem.io/ws/api[/<EndpointId>]     → 127.0.0.1:4005  REST по iroh (netfory/api/1, подписанный pdata)
#   https://ws.smartholdem.io/                        → 127.0.0.1:4005  инфо моста (node, defaultNode, пути)
#
# node.yaml на сервере (мост слушает только loopback — наружу смотрит только nginx):
#   p2p:
#     iroh:
#       enabled: true
#       wallet_api: { enabled: true }
#       ws_bridge:
#         enabled: true
#         listen: 127.0.0.1:4005
#         default_node: ""          # пусто = эта нода; можно указать EndpointId другой ноды
#
# Установка:
#   cp docs/nginx/ws-bridge.smartholdem.io.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/ws-bridge.smartholdem.io.conf /etc/nginx/sites-enabled/
#   certbot certonly --webroot -w /var/www/letsencrypt -d ws.smartholdem.io
#   nginx -t && systemctl reload nginx
#
# Проверка:  curl -s https://ws.smartholdem.io/ | jq .data
#            websocat wss://ws.smartholdem.io/ws/events   →  {"type":"ping"}  →  hello, pong

# один браузер = одно-два соединения; 20 на IP хватает офису за NAT, но режет скрипт-спам
limit_conn_zone $binary_remote_addr zone=sth_ws_conn:10m;
limit_req_zone  $binary_remote_addr zone=sth_ws_new:10m rate=5r/s;

map $http_upgrade $sth_ws_connection {
    default upgrade;
    ''      close;
}

upstream sth_ws_bridge { server 127.0.0.1:4005; }

server {
    listen 80;
    listen [::]:80;
    server_name ws.smartholdem.io;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.smartholdem.io;

    ssl_certificate     /etc/letsencrypt/live/ws.smartholdem.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.smartholdem.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sth_ws_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/ws-bridge.access.log;
    error_log  /var/log/nginx/ws-bridge.error.log warn;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # ---- WebSocket: /ws/events, /ws/events/<id>, /ws/api, /ws/api/<id>
    location ^~ /ws/ {
        limit_conn sth_ws_conn 20;
        limit_req  zone=sth_ws_new burst=10 nodelay;

        proxy_pass http://sth_ws_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $sth_ws_connection;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # кошелёк шлёт ping раз в 60 с, нода закрывает сессию без команд через 300 с — nginx не должен рвать раньше
        proxy_connect_timeout 5s;
        proxy_read_timeout    330s;
        proxy_send_timeout    330s;
        proxy_buffering off;
        # кадры маленькие (MeshPacket ≤ 2 МБ, события — сотни байт)
        client_max_body_size 2m;
    }

    # ---- инфо моста
    location = / {
        add_header Access-Control-Allow-Origin * always;
        proxy_pass http://sth_ws_bridge;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
