# snippet: WebSocket-bridge sth-core on the same domain as the REST API (wss://node-pq01.smartholdem.io/ws/...)
#
# In server { listen 443 } from node-pq01.smartholdem.io.conf add:
#     include snippets/sth-ws-bridge.conf;
# and in http {} (or at the beginning of the sites-available file) declare the zone and map:
#     limit_conn_zone $binary_remote_addr zone=sth_ws_conn:10m;
#     map $http_upgrade $sth_ws_connection { default upgrade; '' close; }
#
# node.yaml:  p2p.iroh.ws_bridge: { enabled: true, listen: 127.0.0.1:4005 }

location ^~ /ws/ {
    limit_conn sth_ws_conn 20;

    proxy_pass http://127.0.0.1:4005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $sth_ws_connection;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout    330s;
    proxy_send_timeout    330s;
    proxy_buffering off;
}
