# CORS for browser clients (wallets, explorers, Vue applications) enabled in location /api/...
# Any origin: public read-only API, POST /api/transactions accepts only signed transactions.
# To restrict the list replace "*" with a map by $http_origin (see docs/nginx/README_RU.md).
#
# IMPORTANT: in node.yaml it should be cors_origins: [] otherwise headers will be duplicated and the browser will reject the response.

add_header Access-Control-Allow-Origin  "*"                                always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"               always;
add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;
add_header Access-Control-Max-Age       "3600"                             always;
# add_header in location overrides headers at the server level - repeat them here
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

if ($request_method = OPTIONS) {
    return 204;
}
