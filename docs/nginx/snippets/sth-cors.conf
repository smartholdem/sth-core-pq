# CORS для браузерных клиентов (кошельки, эксплореры, Vue-приложения) — включается в location /api/...
# Любой origin: публичный read-only API, POST /api/transactions принимает только подписанные транзакции.
# Чтобы ограничить список — замените "*" на map по $http_origin (см. docs/nginx/README_RU.md).
#
# ВАЖНО: в node.yaml должно быть cors_origins: [] — иначе заголовки задублируются и браузер отклонит ответ.

add_header Access-Control-Allow-Origin  "*"                                always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"               always;
add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;
add_header Access-Control-Max-Age       "3600"                             always;
# add_header в location отменяет наследование заголовков уровня server — повторяем их здесь
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

if ($request_method = OPTIONS) {
    return 204;
}
