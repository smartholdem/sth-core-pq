# nginx for public sth-core node: https://node-pq01.smartholdem.io
#
#   /                → 127.0.0.1:4888  operator metrics page (api.page_metrics + api.metrics_listen)
#   /api/ntfry/*     → 127.0.0.1:4888  lightweight snapshots for dashboard/explorer (peers, delegates, metrics, finality, tokens, market)
#   /api/*, /status  → 127.0.0.1:4003  full REST API (wallets, blocks, transactions, POST /api/transactions)
#
# node.yaml on the server (node listens only on loopback outside only nginx):
#   api:
#     host: 127.0.0.1
#     port: 4003
#     page_metrics: true
#     metrics_listen: "127.0.0.1:4888"
#     cors_origins: []            # CORS is handled by nginx (see snippets/sth-cors.conf), keep it disabled in the node
#
# Installation:
#   cp docs/nginx/node-pq01.smartholdem.io.conf /etc/nginx/sites-available/
#   cp docs/nginx/snippets/sth-cors.conf        /etc/nginx/snippets/
#   ln -s /etc/nginx/sites-available/node-pq01.smartholdem.io.conf /etc/nginx/sites-enabled/
#   certbot certonly --webroot -w /var/www/letsencrypt -d node-pq01.smartholdem.io
#   nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=sth_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=sth_post:10m  rate=2r/s;

upstream sth_api     { server 127.0.0.1:4003; keepalive 32; }
upstream sth_metrics { server 127.0.0.1:4888; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name node-pq01.smartholdem.io;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name node-pq01.smartholdem.io;

    ssl_certificate     /etc/letsencrypt/live/node-pq01.smartholdem.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node-pq01.smartholdem.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sth_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/node-pq01.access.log;
    error_log  /var/log/nginx/node-pq01.error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # node transactions small JSON; multipay with 1024 recipients fits in hundreds of KB
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ---- port metrics 4888: page + /api/ntfry/*
    location ^~ /api/ntfry/ {
        include snippets/sth-cors.conf;
        limit_req zone=sth_api burst=40 nodelay;
        proxy_pass http://sth_metrics;
    }

    location = / {
        proxy_pass http://sth_metrics;
    }

    # ---- main API 4003
    location = /api/transactions {
        include snippets/sth-cors.conf;
        # POST receive transaction, GET list; limit
        limit_req zone=sth_post burst=10 nodelay;
        proxy_pass http://sth_api;
    }

    location ^~ /api/ {
        include snippets/sth-cors.conf;
        limit_req zone=sth_api burst=60 nodelay;
        proxy_pass http://sth_api;
    }

    location = /status {
        proxy_pass http://sth_api;
    }

    # all other legacy requests 404 from the node
    location / {
        proxy_pass http://sth_api;
    }
}
