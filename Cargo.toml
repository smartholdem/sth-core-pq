[package]
name = "sth-core"
version = "0.8.1"
edition = "2021"
authors = ["TechnoL0g"]
description = "SmartHoldem relay node core (Rust rewrite of @smartholdem/core)"
license = "MIT"

[lib]
name = "sth_core"
path = "src/lib.rs"

[[bin]]
name = "sth-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
sled = { version = "0.34", features = ["compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "sha256", "std"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
num-bigint = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
indicatif = "0.17"
futures = "0.3"
flate2 = "1"
tar = "0.4"
rmpv = "1"
axum = "0.7"
tokio-tungstenite = "0.24"
prost = "0.13"
serde_yaml = "0.9"
iroh = "1.1.0"
iroh-gossip = "0.101.0"
n0-future = "0.3"

[dev-dependencies]
iroh = "1.1.0"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
strip = "debuginfo"
