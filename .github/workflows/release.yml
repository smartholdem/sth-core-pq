# Release builds: push a tag `vX.Y.Z` (or run manually) → sth-core + sth-cli for Linux x86_64 / aarch64 and macOS arm64 / x86_64,
# packed as tar.gz with SHA256SUMS and attached to the GitHub release. Linux binaries are built on ubuntu-22.04 (glibc 2.35) so they
# run on Debian 12 / Ubuntu 22.04+ hosts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin,      os: macos-14 }
          - { target: x86_64-apple-darwin,       os: macos-13 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --bins --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          ./target/${{ matrix.target }}/release/sth-core --version
          ./target/${{ matrix.target }}/release/sth-cli --version
      - name: Package
        id: pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}"
          NAME="sth-core-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/sth-core target/${{ matrix.target }}/release/sth-cli "dist/$NAME/"
          cp README.md CHANGELOG.md "dist/$NAME/"
          cp -r docs "dist/$NAME/docs"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: cd dist && cat *.sha256 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: false
          body: |
            `sth-core` (node) and `sth-cli` (client) for Linux x86_64 / aarch64 and macOS arm64 / x86_64.
            Verify: `sha256sum -c SHA256SUMS`. Changes: see CHANGELOG.md in the archive.
